services:
  backend:
    build:
      context: ./backend
    container_name: era-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173,https://sagarmahewar.github.io
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - qdrant
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.11.4
    container_name: era-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama:0.5.3
    container_name: era-ollama
    restart: unless-stopped
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

volumes:
  qdrant_storage:
  ollama_storage:
