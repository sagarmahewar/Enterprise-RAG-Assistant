services:
  - type: web
    name: enterprise-rag-assistant-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install ".[dev]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: CORS_ORIGINS
        value: https://sagarmahewar.github.io
      - key: LLM_PROVIDER_BACKEND
        value: groq
      - key: EMBEDDING_PROVIDER_BACKEND
        value: groq
      - key: VECTOR_STORE_BACKEND
        value: qdrant
      - key: RERANKER_BACKEND
        value: local-fake-reranker
      - key: DOCUMENT_ACCESS_POLICY_BACKEND
        value: allow-all
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_LLM_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_EMBEDDING_MODEL
        value: nomic-embed-text-v1.5
      - key: GROQ_TEMPERATURE
        value: "0.1"
      - key: GROQ_MAX_TOKENS
        value: "1024"
      - key: GROQ_REQUEST_TIMEOUT_SECONDS
        value: "60"
      - key: QDRANT_COLLECTION_NAME
        value: rag_chunks_prod
      - key: QDRANT_TIMEOUT_SECONDS
        value: "30"
